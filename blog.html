<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>blog｜キャリアコンサルタント ○○○○</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      background: #fbf6f1;
      color: #4a3a32;
    }
    .simple-header {
      background: #fff;
      border-bottom: 1px solid rgba(77, 51, 38, 0.1);
      padding: 18px 0;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .simple-header a {
      display: inline-block;
      color: #4d3326;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .subpage {
      padding: 64px 0 96px;
    }
    .narrow {
      max-width: 920px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.4;
      color: #4d3326;
      text-align: center;
    }
    .lead {
      margin: 0 auto 40px;
      max-width: 700px;
      font-size: 1.02rem;
      line-height: 1.9;
      color: rgba(74, 58, 50, 0.82);
      text-align: center;
    }
    .link-grid {
      display: grid;
      gap: 24px;
      margin-top: 24px;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #fff;
      border: 1px solid rgba(77, 51, 38, 0.08);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 10px 24px rgba(77, 51, 38, 0.04);
      text-decoration: none;
      color: #4a3a32;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(77, 51, 38, 0.08);
    }
    .card-icon {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .instagram .card-icon {
      background: linear-gradient(135deg, #feda75, #d62976, #4f5bd5);
    }
    .note .card-icon {
      background: #111111;
    }
    .card-copy {
      flex: 1;
    }
    .card-copy h3 {
      margin: 0 0 6px;
      font-size: 1.2rem;
      color: #4d3326;
    }
    .card-copy p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.7;
      color: rgba(74, 58, 50, 0.8);
      word-break: break-all;
    }
    @media (max-width: 640px) {
      .link-card {
        align-items: flex-start;
      }
      .card-icon {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>
<body>
  <header class="simple-header">
    <div class="container">
      <a href="index.html">←</a>
    </div>
  </header>

  <main class="subpage">
    <div class="container narrow">
      <h1>ブログ・SNS</h1>
      <p class="lead">日々の気づきや、キャリアに向き合うヒントを発信しています。<br>Instagramでは日常の気づきを、noteでは少し深めの内容をお届けしています。</p>

      <div class="link-grid">
        <a class="link-card instagram" href="https://www.instagram.com/ritsuko_8837/" target="_blank" rel="noopener noreferrer">
          <div class="card-icon" aria-label="Instagram">
            <svg viewBox="0 0 64 64" aria-hidden="true" role="img">
              <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#igBg)"/>
              <rect x="16" y="16" width="32" height="32" rx="9" fill="none" stroke="white" stroke-width="3.2"/>
              <circle cx="32" cy="32" r="7.5" fill="none" stroke="white" stroke-width="3.2"/>
              <circle cx="42.8" cy="21.7" r="2.4" fill="white"/>
              <defs>
                <linearGradient id="igBg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#feda75"/>
                  <stop offset="30%" stop-color="#f58529"/>
                  <stop offset="60%" stop-color="#dd2a7b"/>
                  <stop offset="100%" stop-color="#4f5bd5"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="card-copy">
            <h3>Instagram</h3>
            <p>@ritsuko_8837</p>
          </div>
        </a>

        <a class="link-card note" href="https://note.com/ritsuko_m" target="_blank" rel="noopener noreferrer">
          <div class="card-icon" aria-label="note">
            <svg viewBox="0 0 64 64" aria-hidden="true" role="img">
              <rect x="0" y="0" width="64" height="64" rx="18" fill="#111111"/>
              <path d="M18 20.5h28v6.4H18v-6.4Zm0 10.2h20.5v6.4H18v-6.4Zm0 10.2h28v6.4H18v-6.4Z" fill="white"/>
              <path d="M40.5 17.5h7.2v29.5h-7.2V17.5Z" fill="white"/>
            </svg>
          </div>
          <div class="card-copy">
            <h3>note</h3>
            <p>note.com/ritsuko_m</p>
          </div>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
