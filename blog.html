<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>blog｜キャリアコンサルタント ○○○○</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      background: #fbf6f1;
      color: #4a3a32;
    }
    .simple-header {
      background: #fff;
      border-bottom: 1px solid rgba(77, 51, 38, 0.1);
      padding: 18px 0;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .simple-header a {
      display: inline-block;
      color: #4d3326;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .subpage {
      padding: 64px 0 96px;
    }
    .narrow {
      max-width: 920px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.4;
      color: #4d3326;
      text-align: center;
    }
    .lead {
      margin: 0 auto 40px;
      max-width: 700px;
      font-size: 1.02rem;
      line-height: 1.9;
      color: rgba(74, 58, 50, 0.82);
      text-align: center;
    }
    .link-grid {
      display: grid;
      gap: 24px;
      margin-top: 24px;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #fff;
      border: 1px solid rgba(77, 51, 38, 0.08);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 10px 24px rgba(77, 51, 38, 0.04);
      text-decoration: none;
      color: #4a3a32;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(77, 51, 38, 0.08);
    }
    .logo {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      display: block;
    }
    .card-copy {
      flex: 1;
    }
    .card-copy h3 {
      margin: 0 0 6px;
      font-size: 1.2rem;
      color: #4d3326;
    }
    .card-copy p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.7;
      color: rgba(74, 58, 50, 0.8);
      word-break: break-all;
    }
    @media (max-width: 640px) {
      .link-card {
        align-items: flex-start;
      }
      .logo {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
<body>
  <header class="simple-header">
    <div class="container">
      <a href="index.html">←</a>
    </div>
  </header>

  <main class="subpage">
    <div class="container narrow">
      <h1>ブログ・SNS</h1>
      <p class="lead">日々の気づきや、キャリアに向き合うヒントを発信しています。<br>Instagramでは日常の気づきを、noteでは少し深めの内容をお届けしています。</p>

      <div class="link-grid">
        <a class="link-card note" href="https://note.com/ritsuko_m" target="_blank" rel="noopener noreferrer">
          <img class="logo" src="assets/images/note-logo.svg" alt="note" width="56" height="56">
          <div class="card-copy">
            <h3>note</h3>
            <p>note.com/ritsuko_m</p>
          </div>
        </a>

        <a class="link-card instagram" href="https://www.instagram.com/ritsuko_8837/" target="_blank" rel="noopener noreferrer">
          <img class="logo" src="assets/images/instagram-logo.svg" alt="Instagram" width="56" height="56">
          <div class="card-copy">
            <h3>Instagram</h3>
            <p>@ritsuko_8837</p>
          </div>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
